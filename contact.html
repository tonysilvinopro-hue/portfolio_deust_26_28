<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silvino Tony | Contact</title>

    <link rel="stylesheet" href="root.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header id="main-header">
        <p>Portfolio</p>

        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="cv.html">CV</a></li>
                <li><a href="projets.html">Projets</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="https://www.univ-littoral.fr/" target="_blank" rel="noopener noreferrer">ULCO</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Me contacter</h1>
            <p>
                Une proposition d'alternance, un projet ou une question ?
                Remplissez le formulaire ci-dessous.
            </p>

            <form action="#" method="post">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="user_name" required>

                <label for="email">Adresse email :</label>
                <input type="email" id="email" name="user_email" required>

                <label for="sujet">Sujet :</label>
                <select id="sujet" name="user_subject">
                    <option value="alternance">Proposition d'alternance</option>
                    <option value="projet">Proposition de projet</option>
                    <option value="info">Demande d'information</option>
                </select>

                <label for="message">Message :</label>
                <textarea id="message" name="user_message" required></textarea>

                <button type="submit">Envoyer</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 — Silvino Tony</p>
    </footer>
</body>
</html>
